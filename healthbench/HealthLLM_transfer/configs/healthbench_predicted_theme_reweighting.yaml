experiment_id: healthbench-predicted-theme-reweighting
paths:
  split: data/healthbench/embedding/healthbench_splits.npz
  scores: data/healthbench/healthbench_metadata_gpt4.1.npz
  checkpoint_dir: checkpoints/predicted_theme
  final_output_dir: reweighted_scores
  score_filename: predicted_theme_reweighted_scores.npz
  weight_filename: predicted_theme_weights.npz
execution:
  n_splits: 500
  batch_size: 25
  smoke_split_id: 1
  median_max_points: 2000
cross_fitting:
  n_folds: 5
theme_labels:
- communication
- complex_responses
- context_seeking
- emergency_referrals
- global_health
- health_data_tasks
- hedging
cases:
- name: case1
  target_mask: all_case1_target
  n_source: 1778
- name: case2
  target_mask: all_case2_target
  n_source: 1439
- name: case3
  target_mask: all_case3_target
  n_source: 2310
representations:
  full:
    path: data/healthbench/embedding/healthbench_bge_m3_embeddings.npz
    blocks:
      p: prompt_embeddings
      r: rubric_embeddings
      i: rubric_information
  pca30:
    path: data/healthbench/embedding/healthbench_bge_m3_pca30_embeddings.npz
    blocks:
      p: prompt_pcs
      r: rubric_pcs
      i: rubric_information
  pca50:
    path: data/healthbench/embedding/healthbench_bge_m3_pca50_embeddings.npz
    blocks:
      p: prompt_pcs
      r: rubric_pcs
      i: rubric_information
  pca80:
    path: data/healthbench/embedding/healthbench_bge_m3_pca80_embeddings.npz
    blocks:
      p: prompt_pcs
      r: rubric_pcs
      i: rubric_information
  pca95:
    path: data/healthbench/embedding/healthbench_bge_m3_pca95_embeddings.npz
    blocks:
      p: prompt_pcs
      r: rubric_pcs
feature_sets:
- name: full_p
  representation: full
  blocks:
  - p
  expected_dimension: 1024
- name: full_p_r
  representation: full
  blocks:
  - p
  - r
  expected_dimension: 2048
- name: pca30_p
  representation: pca30
  blocks:
  - p
  expected_dimension: 20
- name: pca30_p_r
  representation: pca30
  blocks:
  - p
  - r
  expected_dimension: 28
- name: pca50_p
  representation: pca50
  blocks:
  - p
  expected_dimension: 58
- name: pca50_p_r
  representation: pca50
  blocks:
  - p
  - r
  expected_dimension: 80
- name: pca80_p
  representation: pca80
  blocks:
  - p
  expected_dimension: 191
- name: pca80_p_r
  representation: pca80
  blocks:
  - p
  - r
  expected_dimension: 300
- name: pca95_p
  representation: pca95
  blocks:
  - p
  expected_dimension: 377
- name: pca95_p_r
  representation: pca95
  blocks:
  - p
  - r
  expected_dimension: 662
output_methods:
- predicted_theme_hajek
- predicted_probability_kmm
methods:
- name: tabpfn_theme_classifier
  model_id: PriorLabs/TabPFN
  model_revision: ModelVersion.V3
  model_version: V3
  checkpoint_path: models/tabpfn-v3-classifier-v3_default.ckpt
  device: cuda
  n_estimators: 8
  auto_scale_n_estimators: false
  softmax_temperature: 0.9
  ignore_pretraining_limits: true
  inference_precision: float32
  fit_mode: fit_preprocessors
- name: predicted_probability_kmm
  gamma_multipliers:
  - 0.25
  - 1.0
  - 4.0
  cv: 5
  B: 1000
  eps: null
  max_iter: 100
