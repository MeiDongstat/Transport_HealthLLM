[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthbench-cafe"
version = "0.1.0"
description = "HealthBench task-shift and evaluator-shift core estimation experiments."
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "PyYAML>=6", "pyarrow>=20,<21", "joblib>=1.3", "threadpoolctl>=3"]

[project.optional-dependencies]
experiments = ["adapt>=0.4.4", "cvxopt>=1.3", "tensorflow==2.19.1", "tabpfn>=8,<10", "torch>=2.1"]
representation = ["sentence-transformers>=3", "fasttext-wheel>=0.9.2"]

[tool.setuptools.packages.find]
where = ["src"]
